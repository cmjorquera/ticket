<!-- Archivo legacy/desactualizado. Se conserva como respaldo histórico. -->
<div style="background:#ffffff;padding:24px">
<style>
#erd2 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd2 svg.erDiagram .row-rect-odd path,
#erd2 svg.erDiagram .row-rect-odd rect,
#erd2 svg.erDiagram .row-rect-even path,
#erd2 svg.erDiagram .row-rect-even rect { stroke: none !important; }
#erd2 svg.erDiagram text { fill: #1a1a1a !important; }
#erd2 svg.erDiagram .er.entityBox { fill: #ffffff !important; }
#erd2 svg.erDiagram .er.attributeBoxOdd { fill: #f5f5f5 !important; }
#erd2 svg.erDiagram .er.attributeBoxEven { fill: #ffffff !important; }
#erd2 svg.erDiagram .er.entityLabel { fill: #1a1a1a !important; }
#erd2 svg.erDiagram .relationshipLine { stroke: #555 !important; }
#erd2 svg.erDiagram .er.entityBox { stroke: #888 !important; }
</style>
<div id="erd2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: '#555555',
    textColor: '#1a1a1a',
    primaryColor: '#ffffff',
    primaryBorderColor: '#888888',
    primaryTextColor: '#1a1a1a',
    secondaryColor: '#f5f5f5',
    tertiaryColor: '#ffffff'
  },
});
const { svg } = await mermaid.render('erd-svg2', `erDiagram
  COLEGIO ||--o{ EQUIPOS : tiene
  EQUIPOS ||--o| EQUIPOS_COMPRA : compra
  EQUIPOS ||--o| EQUIPO_ALMACENAMIENTO : almacenamiento
  EQUIPOS ||--o| EQUIPO_PROCESADOR : procesador
  EQUIPOS ||--o| EQUIPO_SOFTWARE : software
  EQUIPOS ||--o{ EQUIPO_MEMORIA : memorias
  EQUIPOS ||--o{ EQUIPO_MONITOR : monitores
  EQUIPOS ||--o{ EQUIPO_FOTOS : fotos

  COLEGIO {
    int id_colegio PK
    string nom_colegio
    int estado
  }
  EQUIPOS {
    int id_equipo PK
    int id_colegio FK
    int id_usuario_asignado
    string nombre_equipo
    string fabricante
    string producto
    string numero_serie
    string tipo_pc
    string qr_code
    int id_estado
  }
  EQUIPOS_COMPRA {
    int id_equipo PK
    int valor_equipo
    string proveedor
    string numero_factura
    date fecha_compra
    string observacion
  }
  EQUIPO_ALMACENAMIENTO {
    int id_equipo PK
    string equipo_modelo
    string equipo_capacidad
    string equipo_tamano
  }
  EQUIPO_PROCESADOR {
    int id_equipo PK
    string equipo_fabricante
    string equipo_modelo
    string equipo_velocidad
  }
  EQUIPO_SOFTWARE {
    int id_equipo PK
    string windows
    string office
    string antivirus
  }
  EQUIPO_MEMORIA {
    int id_memoria PK
    int id_equipo FK
    string designacion_memoria
    string formato_memoria
    string tipo_memoria
    int tamano_memoria
    int frecuencia_memoria
    string marca_memoria
    int orden_memoria
  }
  EQUIPO_MONITOR {
    int id_monitor PK
    int id_equipo FK
    string modelo_monitor
    string codigo_monitor
    string serie_monitor
    int tamano_monitor
    string resolucion_monitor
    int orden_monitor
  }
  EQUIPO_FOTOS {
    int id_foto PK
    int id_equipo FK
    string ruta_foto
    int principal
    int orden_foto
    datetime fecha_subida
  }
`);
document.getElementById('erd2').innerHTML = svg;

document.querySelectorAll('#erd2 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd2 svg.erDiagram .row-rect-odd path, #erd2 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});

const svgEl = document.querySelector('#erd2 svg');
if (svgEl) { svgEl.style.background = '#ffffff'; }
</script>
</div>
